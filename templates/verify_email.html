{% extends "base.html" %}{% block title %}Verify email{% endblock %}{% block content %}<div class="narrow"><div class="form-card"><div class="eyebrow">EMAIL VERIFICATION</div><h2>Check your inbox</h2><p class="muted">Enter the 6-digit code sent to your registered email. The code expires in 10 minutes.</p><form method="post" class="stack"><input type="hidden" name="email" value="{{ email }}"><input type="hidden" name="purpose" value="{{ purpose }}"><label>6-digit verification code<input name="otp" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required autocomplete="one-time-code"></label><button class="btn primary full" type="submit">Verify and activate account</button></form></div></div>{% endblock %}
