{% extends "base.html" %}{% block title %}Student signup{% endblock %}{% block content %}
<div class="narrow"><div class="form-card"><div class="eyebrow">GET STARTED</div><h2>Create your student account</h2><p class="muted">Use the email registered with your college. Teachers and admins are provisioned by an administrator.</p>
<form method="post" class="stack"><label>Full name<input name="name" required maxlength="120" placeholder="Your full name"></label><label>College email<input type="email" name="email" required placeholder="name@college.edu"></label><div class="two-col"><label>Roll number<input name="roll_no" placeholder="e.g. CS23014"></label><label>Department<input name="department" placeholder="e.g. Computer Science"></label></div><label>Year / semester<input name="year" placeholder="e.g. Year 2 · Sem 3"></label><label>Password<input type="password" name="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters"></label><button class="btn primary full" type="submit">Create account <span>→</span></button></form><p class="form-bottom">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div></div>{% endblock %}
